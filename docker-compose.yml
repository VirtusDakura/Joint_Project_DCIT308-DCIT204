version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dsa_optimizer_db
    environment:
      POSTGRES_DB: dsa_optimizer
      POSTGRES_USER: ug_dsa_user
      POSTGRES_PASSWORD: dsa_password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
